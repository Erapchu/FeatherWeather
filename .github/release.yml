changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot

  categories:
    - title: "✨ New features"
      labels:
        - enhancement
        - feature

    - title: "🐛 Bug fixes"
      labels:
        - bug

    - title: "⚡ Performance"
      labels:
        - performance

    - title: "🛠 Maintenance"
      labels:
        - "*"