name: Build

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FeatherWeather.sln

      - name: Build
        run: >
          dotnet build FeatherWeather.sln
          --configuration Release
          --no-restore

      # For tests:
      #
      # - name: Test
      #   run: >
      #     dotnet test FeatherWeather.sln
      #     --configuration Release
      #     --no-build